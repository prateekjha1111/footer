<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="100%" height="170">
  <defs>
    <linearGradient id="footerSpace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13092b" />
      <stop offset="50%" stop-color="#080c1f" />
      <stop offset="100%" stop-color="#02030a" />
    </linearGradient>
    <radialGradient id="horizonPlanet" cx="50%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="22%" stop-color="#4c1d95" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="miniSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f97316" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#02030a" stop-opacity="0" />
    </radialGradient>
  </defs>

  
  <rect width="1200" height="170" rx="16" fill="url(#footerSpace)" stroke="#3b0764" stroke-width="2" />

  
  <g fill="#ffffff">
    <circle cx="95" cy="36" r="1.6" opacity="0.85"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite" /></circle>
    <circle cx="210" cy="75" r="1.3" opacity="0.7" />
    <circle cx="320" cy="32" r="1.9" fill="#bae6fd" />
    <circle cx="450" cy="52" r="1.2" opacity="0.8" />
    <circle cx="760" cy="40" r="1.7" fill="#fde047"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.8s" repeatCount="indefinite" /></circle>
    <circle cx="890" cy="68" r="1.4" opacity="0.75" />
    <circle cx="1010" cy="34" r="1.8" opacity="0.9" />
    <circle cx="1115" cy="82" r="1.5" fill="#e9d5ff" />
  </g>

  
  <circle cx="160" cy="55" r="32" fill="url(#miniSun)" />
  <circle cx="160" cy="55" r="11" fill="#fde047" />
  <circle cx="1040" cy="62" r="16" fill="#0284c7" />
  <ellipse cx="1040" cy="62" rx="30" ry="7" fill="none" stroke="#c084fc" stroke-width="2.5" transform="rotate(-15 1040 62)" />

  
  <ellipse cx="600" cy="395" rx="680" ry="275" fill="url(#horizonPlanet)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.65" />

  
  <text x="600" y="66" text-anchor="middle" fill="#f8fafc" font-family="&#39;Segoe UI&#39;, Ubuntu, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1">
    Thanks for exploring my corner of the galaxy!
  </text>
  <text x="600" y="98" text-anchor="middle" fill="#c084fc" font-family="&#39;Fira Code&#39;, Consolas, Monaco, monospace" font-size="15" font-weight="600">
    Building scalable Java backend systems • Let's connect and collaborate
  </text>
</svg>
